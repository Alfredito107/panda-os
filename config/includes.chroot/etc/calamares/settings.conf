# =============================================================================
#  PandA! OS · Configuración de Calamares
#  Basada en /etc/calamares/settings.conf de calamares-settings-debian 13.x
#  (Debian 13 "trixie"), adaptada a PandA! OS.
#
#  Este fichero se copia sobre el del paquete gracias a live-build
#  (config/includes.chroot -> sistema de ficheros de la ISO).
# =============================================================================
---
modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
prompt-install: false
dont-chroot: false

# Directorio de branding: /usr/share/calamares/branding/pandaos
branding: pandaos

sequence:
# --- Fase 1: preparación (páginas de configuración) -------------------------
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary

# --- Fase 2: instalación ----------------------------------------------------
- exec:
  - partition
  - mount
  - unpackfs              # descomprime /run/live/medium/live/filesystem.squashfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager        # configura SDDM y su autologin
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages              # elimina los paquetes de la sesión live
  - shellprocess          # PandA! OS: retira los lanzadores de la sesión live
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount

# --- Fase 3: fin de la instalación ------------------------------------------
- show:
  - finished
