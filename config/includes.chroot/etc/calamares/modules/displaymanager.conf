# =============================================================================
#  PandA! OS · Módulo displaymanager de Calamares
#  PandA! OS usa SDDM (KDE Plasma): se deja el primero de la lista.
# =============================================================================
---
displaymanagers:
  - sddm
  - lightdm
  - gdm
  - lxdm

# Fuerza KDE Plasma como escritorio por defecto en el gestor de sesión.
# Plasma 6 (Debian 13) usa 'startplasma-x11' para la sesión X11, que es la que
# corresponde a /usr/share/xsessions/plasma.desktop. Si al instalar eligieras
# la sesión Wayland, cambia el ejecutable por 'startplasma-wayland'.
# Si diera algún problema, comenta estas tres líneas (como hace Debian): SDDM
# usará Plasma igualmente al ser la única sesión instalada.
defaultDesktopEnvironment:
    executable: "startplasma-x11"
    desktopFile: "plasma"

basicSetup: false
sysconfigSetup: false
