# =============================================================================
#  PandA! OS · Módulo users de Calamares
#  Grupos del usuario creado durante la instalación (impresión y escáner
#  incluidos, imprescindibles para trabajo de oficina e inventarios).
# =============================================================================
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin        # administración de impresoras (CUPS)
    - scanner        # uso de escáneres (simple-scan)
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
