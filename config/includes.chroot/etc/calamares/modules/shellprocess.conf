# =============================================================================
#  PandA! OS · Módulo shellprocess de Calamares
#  Retira del sistema instalado los lanzadores que solo existen en la sesión
#  live (el instalador, su icono de escritorio y su autostart).
# =============================================================================
---
dontChroot: false
timeout: 30
# Un guion inicial hace que Calamares ignore el código de salida del comando
# (igual que en make), de forma que la instalación nunca se aborta aquí.
script:
  - "-rm -f /usr/share/applications/pandaos-install.desktop"
  - "-rm -f /usr/local/bin/pandaos-install"
  - "-rm -f /usr/local/bin/pandaos-desktop-icon"
  - "-rm -f /etc/xdg/autostart/pandaos-install-icon.desktop"
