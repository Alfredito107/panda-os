# =============================================================================
#  PandA! OS · Módulo packages de Calamares
#  Elimina los paquetes que solo tienen sentido en la sesión live, para que el
#  sistema instalado quede limpio.
#
#  `remove`     -> debe funcionar sí o sí (si falla, se aborta la instalación)
#  `try_remove` -> se intenta, y si el paquete no existe no pasa nada
# =============================================================================
---
backend: apt

operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares-settings-debian'
  - try_remove:
      - 'live-boot-initramfs-tools'
      - 'live-task-standard'
      - 'calamares'
