# =============================================================================
#  PandA! OS · Módulo welcome de Calamares
#  Requisitos mínimos para instalar (KDE + LibreOffice en oficina).
# =============================================================================
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

requirements:
    requiredStorage:    25      # GB recomendados
    requiredRam:        2.0     # GB
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
