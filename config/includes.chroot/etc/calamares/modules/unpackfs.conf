# =============================================================================
#  PandA! OS · Módulo unpackfs de Calamares
#  Descomprime el sistema de ficheros live (SquashFS) en el disco de destino.
#  La ruta es la que usa live-boot para montar el medio live.
# =============================================================================
---
unpack:
    -   source: "/run/live/medium/live/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
