# =============================================================================
#  PandA! OS · Compilación automática de la ISO en GitHub Actions
# -----------------------------------------------------------------------------
#  · Manual:        pestaña "Actions" -> "Build PandA! OS ISO" -> "Run workflow"
#  · Por etiqueta:  git tag v1.0.0 && git push origin v1.0.0
#                   (compila y publica un GitHub Release con la ISO)
#
#  La raíz de este repositorio ES la raíz de configuración de live-build
#  (auto/config, config/, build.sh), por eso no hay que cambiar de directorio.
# =============================================================================
name: Build PandA! OS ISO

on:
  workflow_dispatch:
    inputs:
      compression_level:
        description: "Nivel de compresión xz (1-9; 9 = ISO más pequeña y más lenta)"
        required: false
        default: "6"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Compilar ISO (Debian amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Validar la configuración antes de compilar
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          if curl -sSfL -o /tmp/actionlint.tar.gz \
               "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"; then
            tar -xzf /tmp/actionlint.tar.gz -C /tmp
            export ACTIONLINT=/tmp/actionlint
          else
            echo "::warning::No se pudo descargar actionlint; se omite esa comprobación."
          fi
          # Detecta errores de sintaxis, YAML inválido, nombres de módulo
          # inexistentes, comentarios en línea en las listas de paquetes y
          # (con --online) nombres de paquete que no existen en Debian.
          # Se ejecuta ANTES de compilar para no perder 1-3 h de compilación.
          bash tools/validate.sh --online

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Compilar la ISO
        run: |
          # 'bash ./build.sh' (en lugar de './build.sh') funciona aunque el
          # repositorio no conserve el bit de ejecución, p. ej. si se subió
          # desde Windows.
          sudo bash ./build.sh --deps --level "${{ github.event.inputs.compression_level || '6' }}"

      - name: Comprobar el tamaño de la ISO
        id: size
        run: |
          set -e
          shopt -s nullglob
          ISO=""
          for f in ./*.iso; do
            ISO="$f"
            break
          done
          # shellcheck disable=SC2012
          [ -z "$ISO" ] && ISO="$(ls -1 ./*.iso 2>/dev/null | head -n1 || true)"
          SIZE_MB=$(du -m "$ISO" | cut -f1)
          echo "### ISO generada: \`$(basename "$ISO")\` — ${SIZE_MB} MB" >> "$GITHUB_STEP_SUMMARY"
          echo "size_mb=${SIZE_MB}" >> "$GITHUB_OUTPUT"
          if [ "$SIZE_MB" -gt 4096 ]; then
            echo "::error::La ISO (${SIZE_MB} MB) supera el límite de 4 GB"
            exit 1
          fi
          if [ "$SIZE_MB" -gt 2048 ]; then
            echo "too_big=1" >> "$GITHUB_OUTPUT"
            echo "::warning::La ISO (${SIZE_MB} MB) supera el límite de 2 GB por archivo de GitHub Releases."
            echo "::warning::Redúcela (README, apartado «Control de tamaño») o publícala en un servidor externo."
          fi
          sha256sum "$ISO" > "${ISO}.sha256"
          cat "${ISO}.sha256"

      - name: Guardar la ISO como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: panda-os-iso
          path: |
            *.iso
            *.iso.sha256
            *.iso.zsync
          compression-level: 0
          retention-days: 7

      - name: Publicar el GitHub Release (solo con etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/') && steps.size.outputs.too_big != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Solo se adjuntan los ficheros que existan realmente: live-build
          # genera el .zsync únicamente si '--zsync true' está activo.
          shopt -s nullglob
          FICHEROS=(./*.iso ./*.iso.sha256 ./*.iso.zsync)
          if [ ${#FICHEROS[@]} -eq 0 ]; then
            echo "::error::No se encontró ninguna ISO para publicar."
            exit 1
          fi
          printf 'Se publicará: %s\n' "${FICHEROS[@]}"
          gh release create "$GITHUB_REF_NAME" \
            "${FICHEROS[@]}" \
            --title "PandA! OS $GITHUB_REF_NAME" \
            --notes "ISO de PandA! OS $GITHUB_REF_NAME — Debian 13 «trixie» · KDE Plasma · LibreOffice completo en español.

          Descarga el fichero .iso, verifica su suma SHA-256 y escríbelo en un USB
          (o ábrelo con Ventoy, VirtualBox o QEMU).

          Si ya tienes una versión anterior, puedes descargar solo los bloques que
          cambiaron usando el fichero .zsync."

      - name: Aviso si la ISO supera el límite de GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') && steps.size.outputs.too_big == '1'
        run: |
          echo "::warning::No se publica el Release: la ISO (${{ steps.size.outputs.size_mb }} MB) supera los 2 GB que admite GitHub por archivo."
          echo "::warning::La ISO está disponible como artefacto de esta ejecución (7 días)."
          echo "### La ISO supera los 2 GB" >> "$GITHUB_STEP_SUMMARY"
          echo "Descárgala desde la sección *Artifacts* de esta ejecución, o reduce su tamaño y vuelve a etiquetar." >> "$GITHUB_STEP_SUMMARY"
